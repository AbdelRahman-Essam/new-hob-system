{% extends "feed/base.html" %}
{% block content %}<h2>المستخدمون</h2>
{% for u in rows %}<div class="cd"><div class="t"><span>{{ u.username }}{% if u.is_staff %} <span class="tag ok" style="background:var(--o)">مدير</span>{% endif %}{% if not u.is_active %} <span class="tag late">معطّل</span>{% endif %}</span></div>
<div class="row"><a class="btn sec" href="{% url 'user_edit' u.pk %}">تعديل</a>{% if u.pk != request.user.pk %}<a class="btn rd" href="{% url 'user_delete' u.pk %}">حذف</a>{% endif %}</div></div>
{% endfor %}<a class="fab" href="{% url 'user_new' %}">＋ مستخدم</a>{% endblock %}
