# Put this at /etc/nginx/sites-available/newhope, then:
#   sudo ln -s /etc/nginx/sites-available/newhope /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards (see DEPLOY.md) — it will rewrite this file to add the
# HTTPS server block and the http->https redirect automatically.

server {
    listen 80;
    server_name yourname.duckdns.org;   # <-- change to your real DuckDNS (or real) domain

    client_max_body_size 20M;           # comfortably covers CSV/backup-JSON uploads

    location /static/ {
        alias /var/www/newhope/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/run/newhope.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
